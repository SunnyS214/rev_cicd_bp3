name: pipeline bp3
on:
  push:
    branches: [main]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v3 
      - name: docker login karo 
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      
      - name: build-push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
             ${{secrets.DOCKER_USERNAME}}/myapp20sep:latest
             ${{secrets.DOCKER_USERNAME}}/myapp20sep:${{github.sha}}

       